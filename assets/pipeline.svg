<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Detection pipeline">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#00e5ff" stroke-opacity=".06"/></pattern>
<clipPath id="card"><rect width="900" height="200" rx="16"/></clipPath>
<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g clip-path="url(#card)"><rect width="900" height="200" fill="url(#bg)"/><rect width="900" height="200" fill="url(#grid)"/>
<text x="30" y="35" font-family="monospace" font-size="12" letter-spacing="3" fill="#00e5ff">LIVE PIPELINE<animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></text>
<rect x="30" y="60" width="160" height="80" rx="14" fill="#0d1117" stroke="#00e5ff" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="0s" repeatCount="indefinite"/></rect><text x="110" y="95" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#00e5ff">INPUT</text><text x="110" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#9aa7c7">text · url · file</text><line x1="195" y1="100" x2="245" y2="100" stroke="#3b4570" stroke-width="2" stroke-dasharray="4 4"/><rect x="250" y="60" width="160" height="80" rx="14" fill="#0d1117" stroke="#39ff88" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="1s" repeatCount="indefinite"/></rect><text x="330" y="95" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#39ff88">EXTRACT</text><text x="330" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#9aa7c7">cheerio · multer</text><line x1="415" y1="100" x2="465" y2="100" stroke="#3b4570" stroke-width="2" stroke-dasharray="4 4"/><rect x="470" y="60" width="160" height="80" rx="14" fill="#0d1117" stroke="#b388ff" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="2s" repeatCount="indefinite"/></rect><text x="550" y="95" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#b388ff">CLAUDE</text><text x="550" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#9aa7c7">sonnet analysis</text><line x1="635" y1="100" x2="685" y2="100" stroke="#3b4570" stroke-width="2" stroke-dasharray="4 4"/><rect x="690" y="60" width="160" height="80" rx="14" fill="#0d1117" stroke="#ffd54f" stroke-width="2"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4s" begin="3s" repeatCount="indefinite"/></rect><text x="770" y="95" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#ffd54f">VERDICT</text><text x="770" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#9aa7c7">AI · Human · Mixed</text><circle cy="100" r="5" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="30;860" dur="4s" repeatCount="indefinite"/></circle><circle cy="100" r="3" fill="#00e5ff"><animate attributeName="cx" values="30;860" dur="4s" begin="-.25s" repeatCount="indefinite"/></circle><text x="750" y="170" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ff5252">AI 94%<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.3;.31;.6;.8;.99;1" dur="9s" repeatCount="indefinite"/></text><text x="750" y="170" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#39ff88">HUMAN 12%<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.3;.31;.6;.61;1" dur="9s" repeatCount="indefinite"/></text><text x="750" y="170" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ffd54f">MIXED 51%<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.6;.61;.7;.71;.99;1" dur="9s" repeatCount="indefinite"/></text></g><rect x="1" y="1" width="898" height="198" rx="15" fill="none" stroke="#00e5ff" stroke-opacity=".4" stroke-width="1.5"/></svg>